services:
  supermemory:
    build: .
    ports:
      - "6768:6768"
    environment:
      MEMORY_SYSTEM_KEY: ${MEMORY_SYSTEM_KEY:?Set MEMORY_SYSTEM_KEY in your environment}
      SUPERMEMORY_API_KEY: ${SUPERMEMORY_API_KEY:?Set SUPERMEMORY_API_KEY in your environment}
      PORT: 6768
    restart: unless-stopped
